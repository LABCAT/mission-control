# mission-control checks for pull requests. Orbit's ci.yml stays untouched so upstream merges
# don't conflict; this workflow covers the packages and runs on every PR.
name: Mission Control checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mc-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
      TEST_DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter cms build
      - run: pnpm --filter @mission-control/launchpad build

  # Runtime evidence for the theme: the build job proves the demo's HTML exists, this loads it
  # in a real browser and checks the page renders with the tenant tokens in effect.
  launchpad-smoke:
    name: Launchpad smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mission-control/launchpad build
      - name: Install Playwright
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Load the demo in Chromium
        env:
          SMOKE_SCREENSHOT: ${{ runner.temp }}/launchpad-smoke.png
        run: |
          cp .github/scripts/launchpad-smoke.mjs "$RUNNER_TEMP/"
          node "$RUNNER_TEMP/launchpad-smoke.mjs" packages/launchpad/demo/dist
      - name: Upload screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launchpad-smoke
          path: ${{ runner.temp }}/launchpad-smoke.png
          if-no-files-found: ignore

  # A down() that no longer matches its up() only shows up on a rollback, which nothing else
  # runs. This job migrates a disposable Postgres up, rolls every migration back, and
  # migrates up again, then compares the schema.
  migrations:
    name: Migration round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
      # The CLI refuses to load the config without a secret; migrations don't use it.
      PAYLOAD_SECRET: migrate-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration round-trip
        run: |
          # The runner image ships psql; install it only if that ever stops being true.
          if ! command -v psql > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          .github/scripts/migration-round-trip.sh
