# Worker Previews, each on its own Neon branch with this code's migrations applied.
#   Push to a branch with an open PR -> preview named after the branch. Its Neon branch
#   (or a PR is opened/reopened)       (preview/<name>) is cut from prod once and kept,
#                                      so test data survives later pushes. A branch with
#                                      no open PR gets no preview.
#   Push an RC tag (0.2.0-rc.1)      -> preview rc-0-2-0 on a fresh copy of prod, replaced by
#                                      each later RC of that version. Released by release.yml.
#   PR closed/merged, branch deleted -> its preview and Neon branch are deleted.
#   Daily, or run by hand            -> sweep: delete every preview/* Neon branch (and its
#                                      Worker Preview) that has no open PR. See docs/INFRA.md.
name: Preview

on:
  push:
    branches-ignore: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']
  pull_request:
    types: [opened, reopened, closed]
  delete:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the stale previews without deleting anything
        type: boolean
        default: true

concurrency:
  group: preview-${{ github.event_name == 'delete' && github.event.ref || github.event_name == 'pull_request' && github.head_ref || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'sweep' || github.ref_name }}
  cancel-in-progress: true

env:
  NEONCTL: neonctl@8.23.1
  WRANGLER: wrangler@4.157.0
  PLAYWRIGHT: 1.64.1
  WORKER_NAME: ${{ vars.WORKER_NAME || 'orbit-cms' }}
  WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN || 'labcat.workers.dev' }}

jobs:
  # Previews are only for RC tags and for branches with an open PR from this repo.
  gate:
    name: Needs a preview?
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            publish=$([ "$IS_FORK" = true ] && echo false || echo true)
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=true
          else
            open=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json isCrossRepository --jq '[.[] | select(.isCrossRepository | not)] | length')
            publish=$([ "$open" -gt 0 ] && echo true || echo false)
          fi
          [ "$publish" = true ] || echo "::notice::No open PR for $GITHUB_REF_NAME, so no preview. Opening a PR creates it."
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish preview
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      # The branch to preview. On pull_request events GITHUB_REF_NAME is "<n>/merge".
      REF_NAME: ${{ github.head_ref || github.ref_name }}
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Name the preview
        id: name
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::RC tags must be on main"; exit 1; }
            echo "name=$(.github/scripts/preview-name.sh rc "${GITHUB_REF_NAME%%-rc.*}")" >> "$GITHUB_OUTPUT"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(.github/scripts/preview-name.sh branch "$REF_NAME")" >> "$GITHUB_OUTPUT"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the Neon branch
        id: db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT: ${{ vars.NEON_PROJECT_ID }}
          BRANCH: preview/${{ steps.name.outputs.name }}
          FRESH: ${{ steps.name.outputs.fresh }}
          LIMIT: ${{ vars.NEON_BRANCH_LIMIT || '10' }}
        run: |
          set -euo pipefail
          .github/scripts/preview-neon.mjs valid "$BRANCH"
          neon() { npx -y "$NEONCTL" "$@" --project-id "$PROJECT" --api-key "$NEON_API_KEY"; }
          LIST=$RUNNER_TEMP/neon-branches.json
          neon branches list --output json > "$LIST"
          exists=$(jq --arg b "$BRANCH" '[.[] | select(.name == $b)] | length' "$LIST")
          if [ "$exists" != 0 ] && [ "$FRESH" = true ]; then
            neon branches delete "$BRANCH" > /dev/null
            neon branches list --output json > "$LIST"
            exists=0
          fi
          if [ "$exists" = 0 ]; then
            # Fail early with the list of preview/* branches instead of Neon's bare error.
            .github/scripts/preview-neon.mjs capacity "$LIST" "$LIMIT" "$BRANCH" \
              || { echo "::error::Neon branch limit reached, see the log for the existing preview/* branches"; exit 1; }
            neon branches create --name "$BRANCH" --parent main --output json > /dev/null
          fi
          URI=$(neon connection-string "$BRANCH" --database-name neondb --role-name neondb_owner)
          echo "::add-mask::$URI"
          echo "url=$URI" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter cms build

      - name: Migrate the Neon branch
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          PAYLOAD_SECRET: migrate-only
        run: pnpm --filter cms payload migrate

      - name: Publish the Worker Preview
        working-directory: apps/cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ steps.db.outputs.url }}
          PAYLOAD_SECRET: ${{ secrets.PREVIEW_PAYLOAD_SECRET }}
          NAME: ${{ steps.name.outputs.name }}
        run: |
          set -euo pipefail
          [ -n "$PAYLOAD_SECRET" ] || { echo "::error::PREVIEW_PAYLOAD_SECRET is not set"; exit 1; }
          umask 077
          SECRETS=$(mktemp)
          trap 'rm -f "$SECRETS"' EXIT
          jq -n '{DATABASE_URL: env.DATABASE_URL, PAYLOAD_SECRET: env.PAYLOAD_SECRET}' > "$SECRETS"
          pnpm exec wrangler preview --name "$NAME" --worker-name "$WORKER_NAME" --message "$REF_NAME @ $(git rev-parse --short HEAD)" --secrets-file "$SECRETS"

      - name: Smoke
        env:
          URL: https://${{ steps.name.outputs.name }}-${{ env.WORKER_NAME }}.${{ env.WORKERS_SUBDOMAIN }}
        run: |
          for i in $(seq 1 10); do
            if curl -sf --max-time 20 "$URL/api/users/init" | grep -q '"initialized"'; then
              echo "### Preview: $URL/admin" >> "$GITHUB_STEP_SUMMARY"
              echo "Smoke passed on attempt $i: $URL"; exit 0
            fi
            sleep 6
          done
          echo "::error::$URL/api/users/init did not answer"; exit 1

  # Kinsho's runtime evidence (evidence_checks in opencode-review.yml): a real
  # browser loads /admin on the preview and waits for the login form. The curl
  # smoke above only proves the API answers; the admin can still hang client-side.
  admin-smoke:
    name: Admin smoke
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install Playwright
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@${{ env.PLAYWRIGHT }}
          npx playwright install --with-deps chromium
      - name: Load /admin in Chromium
        env:
          URL: https://${{ needs.publish.outputs.name }}-${{ env.WORKER_NAME }}.${{ env.WORKERS_SUBDOMAIN }}
          SMOKE_SCREENSHOT: ${{ runner.temp }}/admin-smoke.png
        run: |
          cp .github/scripts/admin-smoke.mjs "$RUNNER_TEMP/"
          node "$RUNNER_TEMP/admin-smoke.mjs" "$URL"
      - name: Upload screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-smoke
          path: ${{ runner.temp }}/admin-smoke.png
          if-no-files-found: ignore

  # PR closed or merged, or the git branch deleted: remove that branch's preview.
  cleanup:
    name: Delete preview
    if: >-
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the Worker Preview and its Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT: ${{ vars.NEON_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GIT_BRANCH: ${{ github.event.ref || github.head_ref }}
        run: |
          set -euo pipefail
          NAME=$(.github/scripts/preview-name.sh branch "$GIT_BRANCH")
          BRANCH=preview/$NAME
          .github/scripts/preview-neon.mjs valid "$BRANCH"
          npx -y "$WRANGLER" preview delete --name "$NAME" --worker-name "$WORKER_NAME" --skip-confirmation \
            || echo "No Worker Preview named $NAME"
          # Only "not there" is fine; an auth or API failure must fail the job, not leak a branch.
          neon() { npx -y "$NEONCTL" "$@" --project-id "$PROJECT" --api-key "$NEON_API_KEY"; }
          if neon branches list --output json | jq -e --arg b "$BRANCH" 'any(.[]; .name == $b)' > /dev/null; then
            neon branches delete "$BRANCH"
          else
            echo "No Neon branch $BRANCH"
          fi

  # Daily and on demand: delete preview/* Neon branches (and their Worker Previews) with no
  # open PR. Catches whatever the event-driven cleanup missed. Manual runs default to a dry run.
  sweep:
    name: Sweep stale previews
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Delete stale previews
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT: ${{ vars.NEON_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          set -euo pipefail
          neon() { npx -y "$NEONCTL" "$@" --project-id "$PROJECT" --api-key "$NEON_API_KEY"; }
          neon branches list --output json > "$RUNNER_TEMP/branches.json"
          gh pr list --state open --limit 1000 --json headRefName,isCrossRepository > "$RUNNER_TEMP/prs.json"
          [ "$(jq length "$RUNNER_TEMP/prs.json")" -lt 1000 ] || { echo "::error::1000+ open PRs; the list may be truncated"; exit 1; }
          .github/scripts/preview-neon.mjs stale "$RUNNER_TEMP/branches.json" "$RUNNER_TEMP/prs.json" > "$RUNNER_TEMP/stale.txt"
          if [ ! -s "$RUNNER_TEMP/stale.txt" ]; then echo "No stale previews."; exit 0; fi
          echo "Stale previews (no open PR):"; sed 's/^/  /' "$RUNNER_TEMP/stale.txt"
          {
            echo "### Stale previews ($([ "$DRY_RUN" = true ] && echo "dry run, nothing deleted" || echo deleted))"
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/stale.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$DRY_RUN" != true ] || exit 0
          while IFS= read -r BRANCH; do
            .github/scripts/preview-neon.mjs valid "$BRANCH"
            NAME=${BRANCH#preview/}
            npx -y "$WRANGLER" preview delete --name "$NAME" --worker-name "$WORKER_NAME" --skip-confirmation </dev/null \
              || echo "No Worker Preview named $NAME"
            neon branches delete "$BRANCH" </dev/null > /dev/null
            echo "Deleted $BRANCH"
          done < "$RUNNER_TEMP/stale.txt"
