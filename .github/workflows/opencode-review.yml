name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: LABCAT/kinsho/.github/workflows/review.yml@v0.4.0
    with:
      # mc-checks.yml already runs these; Kinsho reads its check runs instead of re-running them
      # in a bare sandbox (no Node 24 / pnpm install).
      run_commands: false
      test_command: pnpm test
      check_command: pnpm typecheck && pnpm lint
      model: ${{ vars.KINSHO_MODEL }}
      effort: ${{ vars.KINSHO_EFFORT }}
      # A runtime change can only PASS once this check is green on the head.
      evidence_checks: |
        Admin smoke
      evidence_wait_minutes: 30
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      KINSHO_APP_ID: ${{ secrets.KINSHO_APP_ID }}
      KINSHO_APP_PRIVATE_KEY: ${{ secrets.KINSHO_APP_PRIVATE_KEY }}
