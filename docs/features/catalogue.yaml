# Features catalogue – Mission Control / Vanuatu Wok
#
# The acceptance criteria for the MVP. Sources: docs/migration/STATUS.md decisions
# (later ones win, to 20 Nov 2026), docs/migration/PROPOSAL-ROLES.md and the legacy
# parity walk in docs/migration/FEATURE-INVENTORY.md.
#
# Conventions
# - id: stable story id. Tests link to it with a `@S-NNN` tag in their title.
# - role: seeker | employer | org owner | site manager | super admin.
# - status: planned | built. `built` means the behaviour exists in this repo.
# - mvp: true when the story must work before launch.
# - settings: per-tenant switches the story depends on. Where the setting exists,
#   the name matches the job-board tenant settings; otherwise it is the planned key.
# - manual: filled in during the staging walk-through (PJ-72); empty until then.
#
# CI runs `scripts/features/report.mjs`, which fails when an MVP story marked
# `built` has no matching `@S-NNN` test.

meta:
  title: Mission Control features catalogue
  version: 1
  updated: 2026-11-24
  sources:
    - docs/migration/STATUS.md
    - docs/migration/PROPOSAL-ROLES.md
    - docs/migration/FEATURE-INVENTORY.md

stories:
  # ---------------------------------------------------------------------------
  # Public site and content
  # ---------------------------------------------------------------------------
  - id: S-001
    area: Public site
    role: seeker
    story: "A visitor lands on the home page and sees the hero, search, feature boxes, latest jobs and page content."
    steps:
      - "Open /"
      - "Read the hero, use the search box, scan the feature boxes and the latest jobs."
    expected: "Every block comes from the CMS in the order the site manager arranged, and latest jobs are featured first, then newest."
    settings:
      - home.blocks
      - jobs.listingOrder
    mvp: true
    status: planned
    tests: []

  - id: S-002
    area: Public site
    role: seeker
    story: "A visitor uses the top, main and footer menus exactly as the site manager configured them."
    steps:
      - "Open any public page."
      - "Open each menu and follow one link."
    expected: "Menus render from CMS menu records, keyboard accessible, and links resolve to the configured pages or URLs."
    settings:
      - site.menus
    mvp: true
    status: planned
    tests: []

  - id: S-003
    area: Public site
    role: site manager
    story: "A site manager sets one site-wide header banner with desktop and mobile images and a link."
    steps:
      - "Add a desktop image, a mobile image, alt text and a link in site settings."
      - "Open the public site at desktop and mobile widths."
    expected: "The matching banner renders above the content on every page, links to the target and does not shift layout."
    settings:
      - site.headerBanner
    mvp: false
    status: planned
    tests: []

  - id: S-004
    area: Public site
    role: seeker
    story: "A visitor reads the About, For Employers, Organisations, Volunteering and Terms pages."
    steps:
      - "Open each system page from the menu."
    expected: "Each page renders its CMS blocks; system pages can be unpublished but not deleted."
    settings:
      - pages.system
    mvp: true
    status: planned
    tests: []

  - id: S-005
    area: Public site
    role: seeker
    story: "A visitor sends a message through the contact form and gets confirmation."
    steps:
      - "Open /contact."
      - "Complete the form and submit."
    expected: "The form validates, passes Turnstile, sends one email to the configured recipient and shows a success message."
    settings:
      - contact.enabled
      - contact.recipient
      - security.turnstile
    mvp: true
    status: planned
    tests: []

  - id: S-006
    area: Public site
    role: seeker
    story: "A visitor who follows a broken link gets a helpful 404 page."
    steps:
      - "Open a URL that does not exist."
    expected: "The response is 404 with links to home, jobs and the organisation directory; no stack trace is shown."
    settings: []
    mvp: true
    status: built
    tests:
      - apps/vwok/src/components/NotFoundPage.test.ts

  - id: S-007
    area: Public site
    role: seeker
    story: "A visitor sees their recently viewed jobs on the site without an account."
    steps:
      - "Open two job pages."
      - "Return to a listing or the home page."
    expected: "The last viewed jobs appear from browser storage, labelled Viewed, with no server-side tracking."
    settings:
      - jobs.recentlyViewed
    mvp: true
    status: planned
    tests: []

  # ---------------------------------------------------------------------------
  # Contact form and map (PJ-102)
  # ---------------------------------------------------------------------------
  - id: S-320
    area: Public site
    role: site manager
    story: "A site manager drops a Form block on a page, points it at one of the site's forms, and visitors see that form."
    steps:
      - "Create a form with text, email and textarea fields in the Forms collection."
      - "Add a Form block to a page and choose the form."
      - "Open the page."
    expected: "The block draws the form's fields in the editor's order with labels, required markers and the submit label, as plain HTML with no client JavaScript; a field with no name, an unknown field type or a form that is not populated is never guessed at, and the honeypot is hidden from people."
    settings:
      - forms
    mvp: true
    status: built
    tests:
      - packages/rocketship-payload/src/form.test.ts
      - packages/rocketship-payload/src/astro/renderers.test.ts

  - id: S-321
    area: Public site
    role: site manager
    story: "A site manager shows the office on a page with a map that needs no API key."
    steps:
      - "Add a Map block with coordinates, or an address for Google."
      - "Open the page and scroll to the map."
    expected: "The block embeds OpenStreetMap or Google Maps in a lazy iframe with an accessible title; a point wins over an address, an out-of-range coordinate or zoom falls back rather than reaching the provider, and a block with nothing to show draws no map."
    settings:
      - map
    mvp: true
    status: built
    tests:
      - packages/rocketship-payload/src/map.test.ts
      - packages/rocketship-payload/src/astro/renderers.test.ts

  - id: S-322
    area: Platform
    role: super admin
    story: "A site manager decides how long form submissions are kept, and 0 means email only."
    steps:
      - "Set the form retention to 90 days, submit a form, then age a submission past the boundary and run the purge."
      - "Set the retention to 0 and submit again."
    expected: "A submission dated one day past the tenant's retention is deleted and one a day inside it is kept; the setting is read per tenant on every run; a second run changes nothing; and at 0 the email is sent and no row is stored."
    settings:
      - formRetentionDays
    mvp: true
    status: built
    tests:
      - packages/payload-jobs/src/forms.test.ts
      - packages/payload-jobs/src/forms.integration.test.ts

  - id: S-323
    area: Public site
    role: site manager
    story: "A site's contact page is seeded with a contact form and a map, and re-running the seed changes nothing."
    steps:
      - "Run the contact page seed for a tenant."
      - "Run it again, then remove the map block and run it once more."
    expected: "The seed creates the tenant's contact form and gives the contact system page the Form block then the Map block; a re-run creates no duplicate and adds no block; a missing block is added back without touching the blocks the editor arranged."
    settings:
      - pages.system
    mvp: true
    status: built
    tests:
      - packages/payload-jobs/src/contact-page.integration.test.ts
      - apps/cms/src/seed/vwok-contact.test.ts

  - id: S-324
    area: Security
    role: seeker
    story: "A form submission is checked for bots, validated against the form, stored for the site and emailed once."
    steps:
      - "Post a form submission with and without a Turnstile token, with a filled honeypot and with a missing required answer."
      - "Post another site's form and another site's key."
    expected: "Only the site named by the site key can submit, and only to its own form; Turnstile and the honeypot are checked before anything is written; a missing required or malformed answer is refused with a message; answers that are not fields of the form are dropped; the notification goes out once, from the tenant's address, to the tenant's admin when the form names no recipient."
    settings:
      - security.turnstile
      - contact.recipient
    mvp: true
    status: built
    tests:
      - packages/payload-jobs/src/forms.integration.test.ts
      - packages/payload-jobs/src/forms.test.ts

  - id: S-008
    area: Public site
    role: seeker
    story: "The public site is English only and declares its language correctly."
    steps:
      - "Inspect any page's html element."
    expected: "The html lang attribute comes from the tenant language setting; no locale switcher is shown."
    settings:
      - defaultLocale
    mvp: true
    status: planned
    tests: []

  - id: S-009
    area: Public site
    role: seeker
    story: "A visitor using a keyboard or screen reader can use every public page."
    steps:
      - "Tab through the header, listings, job page and forms."
      - "Run Lighthouse accessibility on the key pages."
    expected: "Focus order is logical, controls have names, contrast passes and Lighthouse accessibility is 100."
    settings: []
    mvp: true
    status: planned
    tests: []

  - id: S-010
    area: Public site
    role: seeker
    story: "Each tenant's public site shows only its own branding, logo and theme tokens."
    steps:
      - "Open two tenant sites with different branding."
    expected: "Each site uses its own logo and tokens; no other tenant's content or assets appear."
    settings:
      - site.brand
    mvp: true
    status: planned
    tests: []

  - id: S-011
    area: Public site
    role: site manager
    story: "A site key can read only its own tenant's published content, and can never write."
    steps:
      - "Call the read API with tenant A's key for tenant A and tenant B content."
      - "Attempt a write with the key."
    expected: "Tenant A reads succeed, tenant B content and drafts are hidden, and the write is rejected."
    settings: []
    mvp: true
    status: built
    tests:
      - packages/payload-jobs/src/site-keys.test.ts

  # ---------------------------------------------------------------------------
  # Search, listings and filters
  # ---------------------------------------------------------------------------
  - id: S-012
    area: Search and listings
    role: seeker
    story: "A visitor browses all live jobs, newest first, with featured jobs above the list."
    steps:
      - "Open /jobs."
    expected: "Only live, unexpired jobs appear; the featured block comes first, then all jobs newest first."
    settings:
      - jobs.listingOrder
      - jobs.featuredEnabled
    mvp: true
    status: planned
    tests: []

  - id: S-013
    area: Search and listings
    role: seeker
    story: "A visitor uses keyword search across job titles, descriptions, organisations and locations."
    steps:
      - "Enter a keyword in the search box and submit."
    expected: "Results match the keyword through Postgres full-text search, with a clean results URL and empty-state copy."
    settings:
      - search.keyword
    mvp: true
    status: planned
    tests: []

  - id: S-014
    area: Search and listings
    role: seeker
    story: "A visitor filters jobs by location using a clean URL, including sub-locations."
    steps:
      - "Open /jobs/{location} for an island and for a town."
    expected: "The location page lists jobs tagged with that location or any child location; the heading names the location."
    settings:
      - search.filters.location
    mvp: true
    status: planned
    tests: []

  - id: S-015
    area: Search and listings
    role: seeker
    story: "A visitor filters jobs by category using a clean URL."
    steps:
      - "Open /jobs/{category}."
    expected: "The page lists live jobs in that category with the category name as the heading."
    settings:
      - search.filters.category
    mvp: true
    status: planned
    tests: []

  - id: S-016
    area: Search and listings
    role: seeker
    story: "A visitor opens a job type page, and volunteer jobs can be listed separately as in the old site."
    steps:
      - "Open /jobs/{type} for a paid type and for the volunteer type."
    expected: "Each type page lists its live jobs; when listed separately is on, volunteer jobs stay off the main listing and search."
    settings:
      - search.filters.type
      - jobs.typesListedSeparately
    mvp: true
    status: planned
    tests: []

  - id: S-017
    area: Search and listings
    role: seeker
    story: "A visitor filters jobs by salary band."
    steps:
      - "Choose a salary band in the filter bar."
    expected: "Only jobs in that band remain, and the filter is reflected in the URL as a query parameter."
    settings:
      - search.filters.salary
    mvp: true
    status: planned
    tests: []

  - id: S-018
    area: Search and listings
    role: seeker
    story: "A visitor filters jobs by date posted."
    steps:
      - "Choose today, this week or this month."
    expected: "The list keeps only jobs posted in that window and the filter survives a page reload."
    settings:
      - search.filters.datePosted
    mvp: true
    status: planned
    tests: []

  - id: S-019
    area: Search and listings
    role: seeker
    story: "A visitor combines keyword, location, category, type, salary and date filters."
    steps:
      - "Apply several filters together."
      - "Remove one filter."
    expected: "Filters combine with AND semantics, the active filters are visible and removable, and the URL round-trips the state."
    settings:
      - search.keyword
      - search.filters.location
      - search.filters.category
      - search.filters.type
      - search.filters.salary
      - search.filters.datePosted
    mvp: true
    status: planned
    tests: []

  - id: S-020
    area: Search and listings
    role: seeker
    story: "A filter with no matches returns a useful empty page without indexing it."
    steps:
      - "Open a filter combination with no jobs."
    expected: "The page returns 200 with an empty-state message, is noindex, and stays out of the sitemap."
    settings:
      - search.emptyPages
    mvp: true
    status: planned
    tests: []

  - id: S-021
    area: Search and listings
    role: seeker
    story: "Expired jobs never appear in listings, search, alerts or the sitemap."
    steps:
      - "Let a job pass its close date, then search and browse for it."
    expected: "The job is absent from every listing and feed; its own URL still follows the expired-job story."
    settings:
      - jobs.showExpired
      - jobs.expiredMode
    mvp: true
    status: planned
    tests: []

  - id: S-022
    area: Search and listings
    role: seeker
    story: "A visitor browses the organisation directory: every public organisation on one page, with its current job count."
    steps:
      - "Open /organisations."
      - "Filter by type or size."
    expected: "Only public organisations appear, alphabetical, all on one page with no pagination, whether or not they have live jobs; each card shows its logo (initials when it has none) and its count of live jobs (see S-223)."
    settings:
      - organisationPagesNeedApproval
      - site.blocks.organisationDirectory
    mvp: true
    status: built
    tests:
      - packages/launchpad/src/organisations/organisations.test.ts
      - packages/launchpad/src/components/PageView.test.ts

  - id: S-023
    area: Search and listings
    role: seeker
    story: "A visitor opens an organisation page and sees its profile and current jobs."
    steps:
      - "Open /organisations/{slug}."
    expected: "The page shows logo (initials when there is none), type, size, about, location, website and that organisation's own live jobs. Cover image and social links are not drawn yet. A private, unapproved or possible-duplicate organisation is a 404 (see S-224)."
    settings:
      - organisationPagesNeedApproval
    mvp: true
    status: built
    tests:
      - packages/launchpad/src/organisations/organisations.test.ts

  - id: S-024
    area: Search and listings
    role: seeker
    story: "Junk query parameters and tracking parameters never create duplicate pages."
    steps:
      - "Open a listing with unknown parameters, unsorted parameters and utm parameters."
    expected: "Unknown and unsorted parameters 301 to the canonical URL; tracking parameters are kept in the URL but ignored by the cache."
    settings:
      - seo.canonical
    mvp: true
    status: planned
    tests: []

  # ---------------------------------------------------------------------------
  # Job posting (employer)
  # ---------------------------------------------------------------------------
  - id: S-025
    area: Job posting
    role: employer
    story: "A new employer signs up to post a job and gets a user account plus an organisation."
    steps:
      - "Choose Post a job while signed out."
      - "Answer employer or recruitment agency and complete registration."
    expected: "One user and one organisation are created, the first user is the owner, and the account must verify its email before signing in."
    settings:
      - organisations.allowMembers
      - security.blockDisposableEmails
    mvp: true
    status: planned
    tests: []

  - id: S-026
    area: Job posting
    role: employer
    story: "An employer completes the multi-step job form and can leave and resume a draft."
    steps:
      - "Start a job, fill the first step, leave the form."
      - "Return to the draft and continue."
    expected: "The draft is saved after the details step and every later visit resumes the same job without losing fields."
    settings:
      - jobs.drafts
    mvp: true
    status: planned
    tests: []

  - id: S-027
    area: Job posting
    role: employer
    story: "An employer writes a job title and a rich description."
    steps:
      - "Enter a title."
      - "Write and format the description in the Lexical editor."
    expected: "The title is required, the description saves as Lexical JSON and renders safely on the job page."
    settings:
      - jobs.descriptionEditor
    mvp: true
    status: planned
    tests: []

  - id: S-028
    area: Job posting
    role: employer
    story: "An employer picks a required category, and can change it after posting when the site allows."
    steps:
      - "Submit without a category."
      - "Submit with a category, then edit it."
    expected: "The form rejects a missing category; category editing follows the per-tenant required and editable settings."
    settings:
      - jobs.requireCategory
      - jobs.categoryEditable
    mvp: true
    status: planned
    tests: []

  - id: S-029
    area: Job posting
    role: employer
    story: "An employer picks a job type and an optional salary band, with volunteer types defaulting to Voluntary."
    steps:
      - "Choose a volunteer type and a paid type."
      - "Leave or change the salary band."
    expected: "Job type is required, volunteer types preselect the Voluntary band, and the displayed salary text is kept."
    settings:
      - jobs.defaultSalaryBandByType
      - jobs.displayedSalary
    mvp: true
    status: planned
    tests: []

  - id: S-030
    area: Job posting
    role: employer
    story: "An employer tags a job with one or more locations using the chip picker."
    steps:
      - "Type ahead and select an island, a town and Remote anywhere."
      - "Add optional location details."
    expected: "The job stores every chosen location, appears on each matching location page, and keeps the free-text details."
    settings:
      - jobs.locations.mode
    mvp: true
    status: planned
    tests: []

  - id: S-031
    area: Job posting
    role: employer
    story: "An employer chooses a close date up to the plan's maximum."
    steps:
      - "Open the close-date picker."
      - "Try a date beyond the maximum."
    expected: "The default is the maximum allowed, dates beyond it are rejected, and the job page and JSON-LD show the close date."
    settings:
      - jobs.closeDateMaxDays
    mvp: true
    status: planned
    tests:
      - packages/payload-jobs/src/checkout.test.ts
      - packages/payload-jobs/src/checkout.integration.test.ts
      - packages/payload-jobs/src/job-status.test.ts

  - id: S-032
    area: Job posting
    role: employer
    story: "An employer chooses whether to accept online applications and which address receives them."
    steps:
      - "Turn Apply online off and on."
      - "Set the application recipient address."
    expected: "With online apply off the job shows how to apply instead of the form; the recipient defaults to the organisation address."
    settings:
      - jobs.applyOnline
      - jobs.applicationsRecipient
    mvp: true
    status: built
    tests:
      - packages/payload-jobs/src/apply.test.ts
      - packages/launchpad/src/jobs/apply.test.ts
      - packages/launchpad/src/components/components.test.ts

  - id: S-033
    area: Job posting
    role: site manager
    story: "A job follows the allowed status moves and only staff or the system can publish, expire or relist it."
    steps:
      - "Move a job through draft, pending, published, expired and cancelled."
      - "Try an illegal move as an employer."
    expected: "Only the documented transitions succeed; employers can only manage their own drafts, pending jobs and cancellations."
    settings:
      - jobs.moderation
    mvp: true
    status: built
    tests:
      - packages/payload-jobs/src/job-status.test.ts

  - id: S-034
    area: Job posting
    role: employer
    story: "An employer uploads a PDF job description and it appears on the job page."
    steps:
      - "Attach a PDF on a new job."
      - "Open the published job."
    expected: "The PDF is stored in R2, linked from the job page and only editable while the job is being created."
    settings:
      - jobs.descriptionPdf
    mvp: true
    status: planned
    tests: []

  - id: S-035
    area: Job posting
    role: employer
    story: "An employer previews the job before choosing a plan."
    steps:
      - "Complete the job details and choose Preview."
    expected: "The preview renders the public job layout exactly, with no live URL and no indexing."
    settings: []
    mvp: true
    status: planned
    tests: []

  - id: S-036
    area: Job posting
    role: employer
    story: "An employer chooses a plan that applies to the job's category and type and sees the price."
    steps:
      - "Open the plan step for a paid job and for a volunteer job."
    expected: "Only eligible plans are offered, the price comes from the plan record, and included add-ons are shown as included."
    settings:
      - plans.enabled
    mvp: true
    status: planned
    tests: []

  - id: S-037
    area: Job posting
    role: employer
    story: "An employer applies a coupon and the quoted total is reduced correctly."
    steps:
      - "Enter a valid coupon on the plan step."
      - "Enter an expired or invalid coupon."
    expected: "A valid coupon reduces the total by its rule; an invalid coupon explains why and leaves the total unchanged."
    settings:
      - plans.coupons
    mvp: true
    status: planned
    tests:
      - packages/payload-jobs/src/coupons.test.ts
      - packages/payload-jobs/src/checkout.integration.test.ts

  - id: S-038
    area: Job posting
    role: employer
    story: "An employer pays for a single listing with a job credit."
    steps:
      - "Choose Use credits when the organisation has a credit."
    expected: "One credit is spent, the total drops to any add-on balance, and the ledger records the spend."
    settings:
