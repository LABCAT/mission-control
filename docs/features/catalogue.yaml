  # ---------------------------------------------------------------------------
  # Import sync mode (PJ-121)
  # ---------------------------------------------------------------------------
  - id: S-330
    area: Import and cutover
    role: super admin
    story: "A sync run reports legacy records that no longer exist on the old site, and only with an explicit flag takes the matching imported ones off the site, without ever deleting them."
    steps:
      - "Run `pnpm wp-import sync --tenant vwok` and read the list of records gone from the legacy site."
      - "Run it again with `--apply-deletions`."
    expected: "The first run changes nothing. The second expires each listed live job (it can be relisted if it returns on the old site), logs each change, and a third run has nothing left to do. Only this tenant's records that have a legacy id are considered; orders, the credit ledger and users have no removal policy and are never touched; nothing is hard-deleted. Nothing is checked when the source returned no rows, a row failed, a skipped row gave no id, or a read aborted."
    settings: []
    mvp: false
    status: built
    tests:
      - packages/payload-wp-import/src/sync.test.ts
      - packages/payload-wp-import/src/importers/jobs.integration.test.ts

  - id: S-331
    area: Import and cutover
    role: super admin
    story: "A sync run, when asked, follows a changed WordPress password for users who have not signed in yet, and never brings back a hash once the user has signed in."
    steps:
      - "Change a legacy user's password on the old site after the first import."
      - "Run `pnpm wp-import sync --tenant vwok --refresh-credentials`."
    expected: "The user's stored legacy hash is replaced, so the new WordPress password signs them in. A user who already signed in or has a Payload password keeps it, a person whose personal data was removed is never re-created from the old site, an empty legacy hash never blanks a stored one, and a run without the flag leaves credentials alone."
    settings: []
    mvp: false
    status: built
    tests:
      - packages/payload-wp-import/src/sync.test.ts
      - packages/payload-wp-import/src/importers/users.test.ts
      - apps/cms/src/wp-import-users.test.ts

  - id: S-332
    area: Import and cutover
    role: super admin
    story: "One command runs every importer for a tenant in order, supports a dry run, and a second run creates nothing."
