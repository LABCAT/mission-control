      - billing.creditsExpire
    mvp: true
    status: built
    tests:
      - packages/payload-jobs/src/checkout.integration.test.ts

  - id: S-039
    area: Job posting
    role: employer
    story: "Submitting a job creates one order and sends one job-submitted email with the invoice details."
    steps:
      - "Submit a paid job."
      - "Check the organisation's orders and the employer inbox."
    expected: "Exactly one order is created for the organisation, the job waits for payment or approval, and one email covers both the job and the order."
