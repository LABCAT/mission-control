    expected: "One credit is spent, the total drops to any add-on balance, and the ledger records the spend."
    settings:
      - billing.memberCanUseCredits
      - billing.creditsExpire
    mvp: true
    status: built
    tests:
      - packages/payload-jobs/src/checkout.integration.test.ts

  - id: S-039
    area: Job posting
    role: employer
    story: "Submitting a job creates one order and sends one job-submitted email with the invoice details."
    steps:
