      - billing.invoiceOnly
    mvp: true
    status: built
    tests:
      - packages/payload-jobs/src/checkout.integration.test.ts
      - packages/payload-jobs/src/email-engine/notifications.test.ts

  - id: S-040
    area: Job posting
    role: org owner
    story: "A trusted organisation's job goes live immediately and is invoiced afterwards."
    steps:
